

services:
  postgres:
    image: postgres:16
    container_name: jtdactech_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: jtdactech_db
    ports:
    - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: jtdactech_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jtdactech.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    depends_on:
      - postgres

volumes:
  pgdata: