services:
  - type: web
    name: jtdactech-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: jtdactech-postgres
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jtdactech-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://jtdactechhaiti.com,https://www.jtdactechhaiti.com
      - key: CORS_ORIGIN
        value: https://jtdactechhaiti.com,https://www.jtdactechhaiti.com
      - key: BACKEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: EMAIL_PROVIDER
        value: log
      - key: EMAIL_FROM
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: WHATSAPP_PROVIDER
        value: log
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: MONCASH_API_URL
        sync: false
      - key: MONCASH_API_KEY
        sync: false
      - key: NATCASH_API_URL
        sync: false
      - key: NATCASH_API_KEY
        sync: false
      - key: LAJANCASH_API_URL
        sync: false
      - key: LAJANCASH_API_KEY
        sync: false

  - type: keyvalue
    name: jtdactech-redis
    plan: free
    ipAllowList: []

databases:
  - name: jtdactech-postgres
    plan: free
